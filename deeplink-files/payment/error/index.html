<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paiement échoué — AllOn</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fa;
      color: #11181C;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      text-align: center;
      -webkit-text-size-adjust: 100%;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px 20px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; color: #C44747; line-height: 1.3; }
    p { margin: 0 0 18px; line-height: 1.45; color: #687076; font-size: 0.95rem; }
    a.btn {
      display: block;
      width: 100%;
      background: #1776BA;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1rem;
    }
    a.btn + a.btn { margin-top: 10px; background: transparent; color: #1776BA; border: 1px solid #1776BA; }
  </style>
  <script>
    (function () {
      var targets = [
        'allonappmobile:///payment/error',
        'allon:///payment/error',
        'allonappmobile://payment/error',
        'allon://payment/error'
      ];
      var i = 0;
      function tryOpen() {
        if (i >= targets.length) return;
        window.location.href = targets[i++];
        setTimeout(tryOpen, 500);
      }
      setTimeout(tryOpen, 300);
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Retour vers AllOn</h1>
    <p>
      Le paiement n’a pas abouti.
      Si l’application ne s’ouvre pas automatiquement, touchez un bouton ci-dessous.
    </p>
    <a class="btn" href="allonappmobile:///payment/error">Ouvrir AllOn</a>
    <a class="btn" href="allon:///payment/error">Ouvrir (lien alternatif)</a>
  </div>
</body>
</html>
